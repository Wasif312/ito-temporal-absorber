name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the dependencies
        run: python -m pip install -r requirements.txt ruff==0.16.9
      - name: Lint
        run: ruff check src tests paper
      - name: Unit tests and checks of the stored results
        run: python -m pytest
      - name: Material checks
        run: python src/check_step1.py

  paper:
    name: data, tables and figures of the paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the dependencies
        run: python -m pip install -r requirements.txt
      - name: Derive the data, tables and figures from the stored results
        run: |
          python paper/paper_data.py
          python paper/paper_numbers.py
          python paper/paper_extra.py
          python paper/paper_tables.py
          python paper/paper_figures.py
      - name: The tables must come out as committed
        run: git diff --exit-code --stat -- paper/tables
      - name: Checks of the derived data
        run: python -m pytest tests/test_paper.py
